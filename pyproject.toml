[project]
name = "rift-mmm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Japharidze", email = "sergi.japharidze@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
rift-mmm = "rift_mmm:main"

[build-system]
requires = ["uv_build>=0.11.30,<0.12.0"]
build-backend = "uv_build"

[tool.pyright]
venvPath = "."
venv = ".venv"
