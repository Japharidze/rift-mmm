# One neutral line per champion for the blind ranking test (docs/blind-test.md).
# Written 2026-10-05 from each champion's kit text (champion_patch.kit_text),
# never from labels. Approved format (Sergi): a fixed range opener on every
# line -- "Up close:" or "From range:", from Data Dragon's attack range
# (<= 300 is up close) -- then what you do, concretely. No judgement words
# (easy, hard, fun, powerful), no MMM vocabulary, no lore, no lane, no class
# tags; nouns only as the kit names them.

