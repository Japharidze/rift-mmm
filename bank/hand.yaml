# Hand-picked part of the game bank: what the Steam dataset cannot supply.
#
# Two portions sit here (CLAUDE.md, current phase; bank quota ~230 / 35 / 35):
#   video   - games off Steam, or on Steam under a name that would not match.
#   classic - board, card, party and playground games. No dataset ranks these,
#             and none is needed: nobody needs data to know a 14-30 year old
#             EUNE gamer has heard of poker. Panel tap rates judge them later,
#             the same as every other card.
#
# The Steam portion is bank/steam.yaml, generated by `r3m bank-candidates`.
# `r3m bank-import` loads both files; together they are the whole bank.
#
# Fields
#   id      slug; existing ids never change, labels reference them
#   tier    deck (default) = the top list, one entry per game, eclectic.
#           deep = modes and platforms: what a deck pick opens into for
#           comparisons and deep dives. Never the first screen.
#   parent  for a deep entry, the deck entry (or platform) it belongs under
#   mode    passed to the labeller (build_game_message), so a mode is labelled
#           as that mode -- chess blitz is not chess classical
#   year    single release only; null for series and classics, because one
#           year for a franchise is a confident wrong answer (009_game_art.sql)
#   steam   Steam app ids that ARE this entry (UNO on Steam is uno). The
#           candidate generator drops them so they cannot come in twice.
#
# Deduplication rule: sequels and re-releases collapse to one deck entry and
# are not stored (same point, nothing to compare). Modes and platforms whose
# point differs become deep entries with a parent.

