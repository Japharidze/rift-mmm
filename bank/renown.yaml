# Renown of the hand-picked games -- drafted 2026-09-29, reviewed by Sergi 2026-09-30.
#
# The recognition prior for the games Steam cannot rank (bank/hand.yaml): has a
# typical player in the segment -- 14-30, EUNE, plays on PC, new to League --
# ever PLAYED it? Played, not heard of: the card asks "played it?".
#
#   universal  most have
#   wide       a sizeable minority
#   niche      few
#
# The first factor of a card's value (docs/quiz-chain.md §4). Steam games get
# theirs from lifetime reach instead (migration 018). Both are priors: panel tap
# rates correct them wherever the panel has shown the card.
#
# Judged for EUNE on purpose. The draft rated Durak and nine men's morris as
# regional staples and Tarkov as wide; the review moved all three to niche for
# a PC player aged 14-30. Mafia stays wide (Werewolf/Mafia is international).
# Nintendo titles stay wide: less owned in EUNE, though Mario Kart, Pokemon and
# Wii Sports sit at the top of it. Deep entries are not rated: they are never
# first-screen cards.

universal:
  # video
  league-of-legends: "The segment is League newcomers; most have played some."
  minecraft: "Played by nearly everyone in the age band."
  fortnite: "Free, everywhere, the age band's default for years."
  tetris: "Played in some form by nearly everyone."
  candy-crush: "On nearly every phone at some point."
  solitaire: "Bundled with Windows for decades."
  # classic
  chess: "Everyone has played it, if only at school."
  rock-paper-scissors: "Universal."
  tic-tac-toe: "Universal."
  uno: "In most households and on every school trip."
  monopoly: "In most households."
  checkers: "Universal."
  jenga: "Universal at parties."
  table-tennis: "Ping pong at school, camps, offices."
  charades: "Moved from wide to universal in Sergi's review, 2026-09-30."

wide:
  # video
  tft: "Riot's second game; many League newcomers have tried it."
  valorant: "Big in the age band, but a shooter many skip."
  wow: "A generation's MMO; the older band especially."
  hearthstone: "Free, on PC and phone, for a decade."
  osu: "Huge in its niche, known well beyond it."
  smash-bros: "Nintendo, so less owned in EUNE."
  mario-kart: "Nintendo, so less owned in EUNE; played at friends' though."
  mario-64: "Nintendo classic, the older band."
  animal-crossing: "Nintendo; big in 2020."
  pokemon: "Nintendo handhelds; most of the age band touched one."
  genshin-impact: "Very large free audience."
  starcraft-2: "The older band's RTS."
  warcraft-3: "The older band; DotA's origin."
  geoguessr: "Streamers made it widely played."
  wordle: "The 2022 daily habit."
  agar-io: "The 2015 browser wave."
  zelda-botw: "Nintendo; the Switch's defining game."
  mario-party: "Nintendo party game."
  wii-sports: "The older band's childhood."
  pinball-space-cadet: "Bundled with Windows XP; the older band."
  # classic
  poker: "Played casually by many, seriously by few."
  blackjack: "Casino classic, played casually."
  dominoes: "Common in EUNE households."
  connect-4: "Childhood board game."
  battleship: "Childhood game, on paper or in a box."
  scrabble: "Known, played by a minority."
  darts: "Pubs and basements."
  foosball: "Bars, schools, offices."
  8-ball-pool: "Bars, and a big phone game."
  catan: "The best-known modern board game."
  risk: "A family board-game classic."
  cluedo: "A family board-game classic."
  mafia-party: "Schools and camps, especially in Eastern Europe."
  exploding-kittens: "Very popular modern party card game."
  dobble: "Common family game."
  yu-gi-oh: "The age band's playground card game."
  pokemon-tcg: "The age band's playground card game."
  backgammon: "Common in the Balkans and Greece."
  minesweeper: "Moved from universal to wide in Sergi's review, 2026-09-30."
  sudoku: "Moved from universal to wide in Sergi's review, 2026-09-30."

niche:
  # video
  aim-trainers: "Practice tools, played by the competitive few."
