# Renown of the hand-picked games -- drafted 2026-09-29, reviewed by Sergi 2026-09-30.
#
# The recognition prior for the games Steam cannot rank (bank/hand.yaml): has a
# typical player in the segment -- 14-30, plays on PC, new to League, anywhere:
# the product is international -- ever PLAYED it? Played, not heard of: the
# card asks "played it?".
#
#   universal  most have
#   wide       a sizeable minority
#   niche      few
#
# The first factor of a card's value (docs/quiz-chain.md §4). Steam games get
# theirs from lifetime reach instead (migration 018). Both are priors: panel tap
# rates correct them wherever the panel has shown the card.
#
# The draft was judged for EUNE, which is only the test panel. The review moved
# the regional picks (Durak, nine men's morris, Tarkov) to niche; Mafia stays
# wide (Werewolf/Mafia is international). Reasons below that still argue from
# EUNE are marked [EUNE draft]. The panel being EUNE-only biases panel tap
# rates the same way -- accepted for testing, and worth remembering when those
# rates correct these priors.
#
# Deep entries are not rated: they are never first-screen cards.

