  durak: "Moved from universal to niche in Sergi's review, 2026-09-30."
  nine-mens-morris: "Moved from wide to niche in Sergi's review, 2026-09-30."
  escape-from-tarkov: "Moved from wide to niche in Sergi's review, 2026-09-30."
