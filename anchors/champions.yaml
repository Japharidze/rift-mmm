# Anchor scores — the regression test for champion labelling.
#
# Hand-set, not generated. A labelling run that drifts outside these bands means
# the prompt or the model changed, not the game (CLAUDE.md, Conventions).
#
# Band width encodes how precisely the judgment was expressed, not how much it
# is liked. A high/mid/low bucket honestly supports about +/- 0.12; a considered
# placement within a ranking supports about +/- 0.07. Narrowing a band past what
# was actually expressed invents precision and produces false failures.
#
# Floor of +/- 0.12 on every tight band (2026-09-22), for two reasons that add
# up rather than compete. Test-retest over runs 1 and 3 -- same prompt, same
# model, same champions -- put the labeller's own run-to-run drift at 0.02-0.03
# mean and 0.08 max, so anything tighter fails on resampling alone. And the
# judgments underneath were expressed as high/mid/low buckets, which support
# about +/- 0.12 and no more; the +/- 0.07 originally used on the ranking-derived
# rows claimed a precision that was never stated. Widened to the honest figure,
# not to whatever made the run pass.
#
# Scores are absolute and independent per dimension. They do not sum to 1.
# Two edge cases are kept in the set on purpose, to prove the scale is not
# compressed: LeeSin sits high on all three, Garen low on all three.
#
# tier, per dimension:
#   tight       Sergi's own judgment, independent of any model. Blocking.
#   wide        Sergi knows the lane but has not played the champion. Reported,
#               not blocking.
#   provisional Placed or moved by the model. Reference only, never blocking —
#               a model-set anchor cannot test a model, since agreement between
#               two models is not evidence.
#
# `role` matters: the unit is champion x role, so an anchor without a role is
# ambiguous. These are hand-assigned; champion_role is not populated yet.

version: 1

# The vocabulary coarse judgments were expressed in.
buckets:
  high: {point: 0.75, band: [0.65, 0.88]}
  mid-high: {point: 0.63, band: [0.50, 0.76]}   # hedged between mid and high
  mid: {point: 0.50, band: [0.38, 0.62]}
  low-mid: {point: 0.35, band: [0.22, 0.50]}   # hedged between low and mid
  low: {point: 0.20, band: [0.10, 0.32]}

champions:
  - id: LeeSin
    role: jungle
    micro: {point: 0.90, band: [0.78, 1.00], tier: tight}
    meso: {point: 0.80, band: [0.68, 0.92], tier: tight}
    macro: {point: 0.82, band: [0.70, 0.94], tier: tight}
    note: high on all three; the ceiling case for the scale

  - id: Garen
    role: top
    micro: {point: 0.12, band: [0.00, 0.24], tier: tight}
    meso: {point: 0.18, band: [0.06, 0.30], tier: tight}
    macro: {point: 0.38, band: [0.26, 0.50], tier: tight}
    note: low on all three; the floor case for the scale

  - id: Riven
    role: top
    micro: {point: 0.87, band: [0.75, 0.99], tier: tight}
    # Originally ranked meso first. Moved down: perfect execution trivialises
    # Riven far more than knowing enemy intent does, and top-of-both-lists was
    # the halo pattern. Not re-confirmed by Sergi, so it cannot block.
    meso: {point: 0.50, band: [0.38, 0.62], tier: provisional}
    macro: {point: 0.40, band: [0.28, 0.52], tier: tight}

  - id: TwistedFate
    role: mid
    micro: {point: 0.52, band: [0.40, 0.64], tier: tight}
    meso: {point: 0.72, band: [0.60, 0.84], tier: tight}
    macro: {point: 0.90, band: [0.78, 1.00], tier: tight}

  - id: Annie
    role: mid
    micro: {point: 0.20, band: [0.08, 0.32], tier: tight}
    meso: {point: 0.40, band: [0.28, 0.52], tier: tight}
    macro: {point: 0.45, band: [0.33, 0.57], tier: tight}

  - id: Azir
    role: mid
    micro: {point: 0.75, band: [0.63, 0.88], tier: tight}
    meso: {point: 0.50, band: [0.38, 0.62], tier: tight}
    # Anchored high; every prompt version put it mid, including v2's macro
    # rewrite that moved everything else. Conceded to the labeller 2026-09-22,
    # so it is no longer an independent reading and cannot block.
    macro: {point: 0.45, band: [0.33, 0.57], tier: provisional}

  - id: Orianna
    role: mid
    micro: {point: 0.50, band: [0.38, 0.62], tier: tight}
