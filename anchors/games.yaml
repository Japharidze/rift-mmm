# Anchor scores for games — the other half of the MMM space.
#
# Champions and games share one absolute 0–1 scale per dimension. That is what
# makes matching a player's taste against a champion mean anything, so these
# two files are calibrated against each other, not independently.
#
# ## Where the numbers come from
#
# Surnex placed these games himself (docs/3m-model.md, from the two videos).
# He placed them into *categories* — "pure micro", "micro + meso", "all three"
# — not onto numbers. The numbers below come from applying the mapping in
# `categories` mechanically, so each value traces to his category rather than
# to anyone's opinion of the game. Where he stated an ordering inside a
# category ("CS2 macro relatively lowest"), that is applied as an override and
# his wording is kept in the note.
#
# ## Why there is no centre
#
# Surnex's examples are all poles, edges and corners. That is a property of his
# *explanation*, not of the space: extremes teach a model more clearly than
# middling cases. So the mid-range entries at the bottom are not patching a gap
# in his model — they complete a coverage his purpose never needed. Without
# them, scale compression in the middle is invisible, which is exactly the
# failure that cost three prompt versions on the champion side
# (docs/sub-traits.md, v4–v6).
#
# ## Tiers
#
#   source       Surnex's own placement, converted by the mapping. Blocking.
#   tight        Sergi's judgment, independently placed. Blocking.
#   provisional  Placed or moved by a model. Reports, never blocks.

version: 1

categories:
  # dimension named -> 0.92; the others -> 0.12. Poles define what 1.0 means.
  pure:        {high: 0.92, low: 0.12, band: 0.10}
  # both named -> 0.80; the third -> 0.18.
  pair:        {high: 0.80, low: 0.18, band: 0.12}
  # all three high, balance unstated unless overridden per game.
  all_three:   {high: 0.78, band: 0.12}

