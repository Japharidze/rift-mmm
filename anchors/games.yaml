  # ---- mid-range and the low corner ---------------------------------------
  # Placed by Sergi 2026-09-23, without reference to any model output.
  # These complete a coverage Surnex's explanation never needed: he placed
  # poles, edges and corners because extremes teach the model, and nothing
  # in the middle or at the origin.
  #
  # The low corner matters most. Without it the 14 champions that sit low on
  # all three - Garen, Cho'Gath, Lulu, Malzahar - are unreachable, and a
  # newcomer whose honest answer is "I like relaxed games" gets pushed toward
  # a pole they did not ask for. Landing that user on Garen is correct advice,
  # not a failure of the model.

