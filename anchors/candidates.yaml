# Anchor worksheet — candidates from the podcast, for Sergi to place.
#
# Generated from docs/champion-classes.md, sourced from
# docs/transcripts/02-champion-classes.md. NOT anchors yet: every micro/meso/
# macro below is `?` and must be filled by hand before any of this is merged
# into anchors/champions.yaml.
#
# Replace each TODO with a bucket name, not a number: high, mid-high, mid,
# low-mid, low.
# That is the vocabulary anchors/champions.yaml already converts to bands, and
# it is the precision a judgment of this kind actually supports.
#
# The division of labour is the point. The coaches answered "what does this
# champion demand" -- the part that needs champion knowledge. What is left is
# "which of the three is that", which needs model knowledge. Do not ask a
# model to fill these: a model-set anchor cannot test a model.
#
# `purist: true` means the coaches named it the extreme case of its class
# ("Zoe is purest because she has no fallback"). Those are the valuable ones --
# the champion cloud does not reach the corners (Gate 2), and extremes are
# what a regression test is short of.
#
# `live` is the role(s) the match data actually shows, for cross-checking the
# role the podcast discusses it in. Where they disagree, the match data wins
# for `role:` and the disagreement is worth a note.
#
# `chapter_line` is the line in docs/transcripts/02-champion-classes.md where
# that class chapter starts, so any placement can be checked against what was
# actually said.

